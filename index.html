<html lang="my">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Padauk', 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1e0b36, #0d041a, #030008);
            overflow: hidden;
            height: 100vh;
            touch-action: manipulation;
        }

        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }

        /* Smooth falling animation stopping in the center */
        @keyframes floatDownToCenter {
            0% {
                transform: translate(-50%, -100vh) rotate(-10deg);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            35% {
                transform: translate(-38%, -12vh) rotate(6deg);
            }
            65% {
                transform: translate(-58%, 8vh) rotate(-4deg);
            }
            85% {
                transform: translate(-46%, 18vh) rotate(3deg);
            }
            100% {
                transform: translate(-50%, 20vh) rotate(-1deg);
            }
        }

        /* Gentle floating/swaying while staying in screen center */
        @keyframes centerSwaying {
            0%, 100% {
                transform: translate(-50%, 20vh) rotate(-1deg) scale(1);
            }
            50% {
                transform: translate(-50%, 16vh) rotate(2deg) scale(1.04);
            }
        }

        /* Transparent GIF Floating Container */
        .free-floating-image {
            position: absolute;
            top: 25%;
            left: 50%;
            animation: floatDownToCenter 5.5s cubic-bezier(0.25, 1, 0.5, 1) forwards,
                       centerSwaying 4s ease-in-out infinite 5.5s;
            cursor: pointer;
            transition: filter 0.3s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        .free-floating-image img {
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            background: transparent !important;
            filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.6));
        }

        .free-floating-image:hover img {
            filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.95));
        }

        /* Click prompt badge animation */
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.85; transform: scale(0.96); }
            50% { opacity: 1; transform: scale(1.06); }
        }

        .click-hint {
            animation: pulseGlow 1.8s infinite;
        }

        /* --- ROYAL PARCHMENT & GOLDEN EMBOSSED CARD STYLES --- */
        .royal-gold-bg {
            background-color: #2b0b14;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(217, 119, 6, 0.15), transparent 80%),
                linear-gradient(135deg, rgba(180, 83, 9, 0.25) 25%, transparent 25%),
                linear-gradient(225deg, rgba(180, 83, 9, 0.25) 25%, transparent 25%);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), 0 0 30px rgba(217, 119, 6, 0.2);
        }

        .parchment-paper {
            background: linear-gradient(180deg, #fefce8 0%, #fef3c7 50%, #fde68a 100%);
            box-shadow: inset 0 0 20px rgba(180, 83, 9, 0.2), 0 8px 25px rgba(0,0,0,0.4);
            border: 1px solid #f59e0b;
        }

        /* Stamp Photo Style at bottom right */
        .stamp-photo {
            background: #fff;
            padding: 4px;
            border: 2px dashed #d97706;
            box-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            transform: rotate(5deg);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .stamp-photo:hover {
            transform: rotate(0deg) scale(1.12);
            box-shadow: 0 10px 20px rgba(217, 119, 6, 0.4);
        }

        /* Typing cursor effect */
        .typing-cursor::after {
            content: '|';
            animation: blink 0.7s infinite;
            color: #b45309;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Floating Sky Lanterns Particle Animation */
        .sky-lantern {
            position: absolute;
            width: 22px;
            height: 30px;
            background: radial-gradient(circle at 50% 80%, #fef08a, #f59e0b 60%, #b45309 90%);
            border-radius: 6px 6px 4px 4px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.8);
            pointer-events: none;
            animation: floatLantern var(--duration) linear infinite;
            opacity: 0.85;
        }

        .sky-lantern::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 4px;
            background: #78350f;
            border-radius: 2px;
        }

        @keyframes floatLantern {
            0% {
                transform: translateY(105vh) translateX(0) scale(0.4);
                opacity: 0;
            }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% {
                transform: translateY(-15vh) translateX(var(--drift)) scale(1.1);
                opacity: 0;
            }
        }

        /* Password Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>

    <script>
        // Updated Passcode
        const CORRECT_PASSCODE = "2292026";
        let currentPasscode = "";

        const titleText = "သီတင်းကျွတ်အခါသမယလေးမှာ 🪔✨";
        const body1Text = "အကိုဘဝမှာ စိတ်ချမ်းသာခြင်း၊ ကိုယ်ကျန်းမာခြင်းတွေနဲ့အတူ ကောင်းခြင်းမင်္ဂလာတွေအမြဲပြည့်စုံပါစေ။ လုပ်သမျှအရာတိုင်း အဆင်ပြေချောမွေ့ပြီး ရည်မှန်းထားသမျှတွေလည်း တစ်ခုပြီးတစ်ခု အကောင်အထည်ဖော်နိုင်ပါစေ။ စိတ်ညစ်စရာတွေ ဝေးကွာပြီး ပျော်ရွှင်စရာနေ့ရက်လေးတွေပဲ ပိုင်ဆိုင်နိုင်ပါစေ။ အကိုဘေးမှာ အမြဲနွေးထွေးပေးမယ့်သူတွေရှိပြီး ချစ်ခြင်းမေတ္တာတွေနဲ့ ပြည့်နှက်နေပါစေ။";
        const body2Text = "ဒီသီတင်းကျွတ်ကစပြီး အကိုအတွက် ကောင်းခြင်းတွေချည်းပဲ ရောက်လာပါစေလို ဆုတောင်းပေးပါတယ်။ 🥰🪔💫";

        let isTyping = false;
        let typingTimeout;

        function startExperience() {
            const startScreen = document.getElementById('startScreen');
            const mainContent = document.getElementById('mainContent');

            startScreen.classList.add('opacity-0');
            setTimeout(() => {
                startScreen.style.display = 'none';
                mainContent.classList.remove('hidden');
                createSkyLanterns();
            }, 700);
        }

        function createSkyLanterns() {
            const container = document.getElementById('lantern-container');
            if (!container) return;
            const lanternCount = 20;

            for (let i = 0; i < lanternCount; i++) {
                const lantern = document.createElement('div');
                lantern.classList.add('sky-lantern');
                
                const left = Math.random() * 100;
                const duration = Math.random() * 8 + 8;
                const delay = Math.random() * 6;
                const drift = (Math.random() - 0.5) * 120;

                lantern.style.left = `${left}%`;
                lantern.style.setProperty('--duration', `${duration}s`);
                lantern.style.setProperty('--drift', `${drift}px`);
                lantern.style.animationDelay = `${delay}s`;

                container.appendChild(lantern);
            }
        }

        /* Passcode Functions */
        function promptPasscode() {
            currentPasscode = "";
            updatePasscodeDots();
            
            const modal = document.getElementById('passwordModal');
            const card = document.getElementById('passcodeCard');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closePasscodeModal() {
            const modal = document.getElementById('passwordModal');
            const card = document.getElementById('passcodeCard');
            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
        }

        function closePasscodeOnBg(e) {
            if (e.target.id === 'passwordModal') closePasscodeModal();
        }

        function appendPasscode(digit) {
            if (currentPasscode.length < 7) {
                currentPasscode += digit;
                updatePasscodeDots();

                if (currentPasscode.length === 7) {
                    setTimeout(verifyPasscode, 150);
                }
            }
        }

        function removeLastPasscode() {
            if (currentPasscode.length > 0) {
                currentPasscode = currentPasscode.slice(0, -1);
                updatePasscodeDots();
            }
        }

        function clearPasscode() {
            currentPasscode = "";
            updatePasscodeDots();
        }

        function updatePasscodeDots() {
            const dotsContainer = document.getElementById('passcodeDots');
            const dots = dotsContainer.children;
            for (let i = 0; i < dots.length; i++) {
                if (i < currentPasscode.length) {
                    dots[i].classList.remove('bg-transparent');
                    dots[i].classList.add('bg-amber-400', 'shadow-[0_0_8px_rgba(245,158,11,0.8)]');
                } else {
                    dots[i].classList.remove('bg-amber-400', 'shadow-[0_0_8px_rgba(245,158,11,0.8)]');
                    dots[i].classList.add('bg-transparent');
                }
            }
        }

        function verifyPasscode() {
            if (currentPasscode === CORRECT_PASSCODE) {
                closePasscodeModal();
                
                // Play Background Music Automatically upon correct passcode
                playAudioAuto();

                setTimeout(openWishCard, 300);
            } else {
                const card = document.getElementById('passcodeCard');
                card.classList.add('animate-shake');
                
                // Red flash feedback
                const dots = document.getElementById('passcodeDots').children;
                for (let dot of dots) {
                    dot.classList.add('border-rose-500', 'bg-rose-500');
                }

                setTimeout(() => {
                    card.classList.remove('animate-shake');
                    clearPasscode();
                    for (let dot of dots) {
                        dot.classList.remove('border-rose-500', 'bg-rose-500');
                    }
                }, 500);
            }
        }

        /* Auto Music Playback Function */
        function playAudioAuto() {
            const audio = document.getElementById('bgMusic');
            if (audio) {
                audio.play().catch(err => {
                    console.log("Audio play request allowed on user interaction", err);
                });
            }
        }

        /* Keyboard Support for Passcode */
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('passwordModal');
            if (modal.classList.contains('opacity-100')) {
                if (e.key >= '0' && e.key <= '9') {
                    appendPasscode(e.key);
                } else if (e.key === 'Backspace') {
                    removeLastPasscode();
                } else if (e.key === 'Escape') {
                    closePasscodeModal();
                }
            }
        });

        /* Wish Card Functions */
        function openWishCard() {
            const modal = document.getElementById('wishModal');
            const modalCard = document.getElementById('modalCard');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');

            // Reset text elements
            document.getElementById('typeTitle').textContent = '';
            document.getElementById('typeBody1').textContent = '';
            document.getElementById('typeBody2').textContent = '';
            document.getElementById('cardFooter').classList.add('opacity-0');

            // Start Typewriter Animation
            setTimeout(startTypingEffect, 300);
        }

        function startTypingEffect() {
            isTyping = true;
            typeSentence('typeTitle', titleText, 45, () => {
                typeSentence('typeBody1', body1Text, 35, () => {
                    typeSentence('typeBody2', body2Text, 35, () => {
                        document.getElementById('cardFooter').classList.remove('opacity-0');
                        isTyping = false;
                    });
                });
            });
        }

        function typeSentence(elementId, text, speed, callback) {
            const el = document.getElementById(elementId);
            el.classList.add('typing-cursor');
            let i = 0;

            function typeChar() {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(typeChar, speed);
                } else {
                    el.classList.remove('typing-cursor');
                    if (callback) callback();
                }
            }
            typeChar();
        }

        function closeWishCard() {
            const modal = document.getElementById('wishModal');
            const modalCard = document.getElementById('modalCard');

            clearTimeout(typingTimeout);

            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');

            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
        }

        function closeWishCardOnBg(event) {
            if (event.target.id === 'wishModal') {
                closeWishCard();
            }
        }

        /* Full Photo Modal Functions */
        function openPhotoModal(event) {
            event.stopPropagation();
            const photoModal = document.getElementById('photoModal');
            photoModal.classList.remove('opacity-0', 'pointer-events-none');
            photoModal.classList.add('opacity-100', 'pointer-events-auto');
        }

        function closePhotoModal() {
            const photoModal = document.getElementById('photoModal');
            photoModal.classList.remove('opacity-100', 'pointer-events-auto');
            photoModal.classList.add('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
